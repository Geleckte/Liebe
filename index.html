<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f8e8ee">
  <meta name="description" content="Eine kleine Nachricht für dich">
  <title>Für dich</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="scene" id="scene">
    <div class="hearts-bg" id="heartsBg" aria-hidden="true"></div>

    <!-- Phase 1: Start -->
    <section class="phase phase-start active" id="phaseStart">
      <button class="start-btn" id="startBtn" type="button" aria-label="Brief öffnen">
        <span class="heart-icon" aria-hidden="true">♥</span>
        <span class="start-hint" id="startHint">Tippe hier</span>
      </button>
    </section>

    <!-- Phase 2: Brief -->
    <section class="phase phase-letter" id="phaseLetter" aria-hidden="true">
      <div class="envelope-wrap" id="envelopeWrap">
        <div class="envelope">
          <div class="envelope-flap"></div>
          <div class="envelope-body"></div>
          <div class="letter-card" id="letterCard">
            <p class="letter-label">Für dich</p>
            <h1 class="letter-title" id="letterTitle">Ich liebe dich</h1>
            <p class="letter-text" id="letterText"></p>
            <p class="letter-sign" id="letterSign"></p>
          </div>
        </div>
      </div>
      <p class="tap-more" id="tapMore" hidden>Tippe für mehr Herzen</p>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
